name: Data refresh (OpenStreetMap)

on:
  schedule:
    - cron: "0 3 * * 1"  # co tydzien, poniedzialek 03:00 UTC
  workflow_dispatch: {}

# Workflow commituje i pushuje odswiezone dane do repo.
permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo (master)
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Seed cities + fetch OSM (Overpass) + build dataset
        run: npm run data:all -- --refresh

      - name: Unit + data tests
        run: npm test

      - name: Build site
        run: npm run build

      - name: Quality gate (SEO + page quality)
        run: npm run quality:analyze

      - name: Commit changes
        run: |
          git config user.name "seo-bot"
          git config user.email "bot@gdziemy.pl"
          git add packages/data docs/agent/QUALITY_SCORE.md
          git diff --cached --quiet || git commit -m "chore: weekly OSM data refresh"
          git push origin master
